[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pyinfinitensor"
version = "0.0.0"
authors = [{ name = "YdrMaster", email = "ydrml@hotmail.com" }]
description = "Python frontend of InfiniTensor"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["optimizer"]
license = { text = "Apache" }
classifiers = ["Programming Language :: Python :: 3"]
dependencies = [
    "numpy>=1.21",
    "onnx>=1.14,<2",
    "onnxruntime>=1.17,<2",
    "onnxsim>=0.4.36,<0.5",
]

[project.optional-dependencies]
agent = ["mcp==1.28.0; python_version >= '3.10'", "transformers>=4.44,<5", "torch>=2.4,<3", "safetensors>=0.4"]
embedding = ["transformers>=4.30,<5", "torch>=2.4,<3", "safetensors>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyinfinitensor = ["*.so"]
