name: Clean InfiniOps native build
on:
  pull_request:
  push:
    branches: [master]

jobs:
  native:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install code generation dependencies
        run: python -m pip install libclang==18.1.1 PyYAML numpy
      - name: Build native providers and InfiniTensor without ATen
        run: bash scripts/test_infiniops_native_build.sh
